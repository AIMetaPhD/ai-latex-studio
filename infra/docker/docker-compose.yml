# AI LaTeX Studio — reproducible local deployment (G2)
# Reference server: Linux x86_64 + Docker Engine/Compose. Images pinned by digest.
# Loopback-only by default (OVERLEAF_LISTEN_IP). Never bind 0.0.0.0 without a
# reviewed security design (see docs/THREAT-MODEL.md).
#
# Secrets model (verified against CE 6.3.2 startup scripts in-container):
#  - OVERLEAF_INVITE_TOKEN_SECRET is the ONLY secret CE requires from us.
#  - Internal service secrets (web API password, OT JWT key, ...) are
#    self-generated by the image on first run — we do not pass them.
#  - AI_GATEWAY_SECRET guards the CE-gateway -> sidecar channel (our addition).
#
# All image/name values come from .env (see .env.example); scripts/up.sh
# asserts CE_BASE_REF resolves to the pinned official digest before building.

name: ai-latex-studio

services:
  ce:
    restart: always
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ce
      args:
        CE_IMAGE: ${CE_BASE_REF:?set in .env}
    image: ai-latex-studio/ce:${AILS_CE_TAG:-local}
    # Service name is the stable ASCII "ce"; the image's own services still
    # address this box by the internal hostname, kept as an explicit alias.
    hostname: ${CE_INTERNAL_HOST:?set in .env}
    networks:
      default:
        aliases:
          - ${CE_INTERNAL_HOST:?set in .env}
    container_name: ${AILS_PREFIX:-ails}-ce
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      sidecar:
        condition: service_started
    volumes:
      - ce-data:/var/lib/overleaf
    ports:
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${OVERLEAF_PORT:-8080}:80"
    environment:
      OVERLEAF_APP_NAME: AI LaTeX Studio
      OVERLEAF_MONGO_URL: ${CE_MONGO_URL:?set in .env}
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      V1_HISTORY_URL: ${CE_HISTORY_URL:?set in .env}
      GIT_BRIDGE_ENABLED: "false"
      ENABLE_CONVERSIONS: "true"
      EMAIL_CONFIRMATION_DISABLED: "true"
      # Shown on the (disabled) register page as "contact this address".
      # CE falls back to placeholder@example.com when unset — doctor warns.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      EXTERNAL_AUTH: none
      ENABLED_LINKED_FILE_TYPES: project_file,project_output_file
      OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET:?set in .env (scripts/up.sh generates it)}
      # server-to-server secret for the /api/ai gateway -> sidecar channel
      AI_GATEWAY_SECRET: ${AI_GATEWAY_SECRET:?set in .env (scripts/up.sh generates it)}
      AI_SIDECAR_URL: http://sidecar:8090
      # Opt-in password-less entry for a single-user loopback deployment. The
      # gateway serves GET /ails-login only when this is "1" AND the peer is
      # 127.0.0.1/::1, so it can never open the app to another host. Off by
      # default; the normal /login page and CSRF/session rules are unchanged.
      AILS_LOCAL_AUTOLOGIN: ${AILS_LOCAL_AUTOLOGIN:-0}
      # Wall-clock deadline for one compile (ms). Upstream's own timeout is not
      # enforced by the local runner; this one kills the process group.
      AILS_COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-180000}
    stop_grace_period: 60s
    # Minimum privilege that still lets CE + TeX Live work (measured on the
    # reference server: project creation, upload, compile to PDF, edit + reload).
    # The compile runs INSIDE this container, so these limits are the only
    # boundary between a malicious .tex and this host -- see
    # reports/COMPILER_TRUST_BOUNDARY.md for what they do and do not buy.
    #
    # Ceilings are measured, not guessed (2026-11-03, 16-core / 15.5 GiB host):
    # a normal two-page IEEE compile peaked at 66% of one core and 1.14 GiB for
    # the whole container; a runaway document sat on one core until the
    # deadline killed it. 4 cpus leaves room for a browser-driven compile plus
    # web/clsi work while capping several runaways, and 4 GiB is ~3.5x the
    # measured peak. Override per machine: the right number depends on the
    # document sizes a user compiles.
    cpus: ${CE_CPUS:-4}
    mem_limit: ${CE_MEM_LIMIT:-4g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
    pids_limit: ${CE_PIDS_LIMIT:-2048}

  sidecar:
    restart: always
    build:
      context: ../..
      dockerfile: services/ai-sidecar/Dockerfile
    image: ai-latex-studio/sidecar:${AILS_SIDECAR_TAG:-local}
    container_name: ${AILS_PREFIX:-ails}-sidecar
    environment:
      AI_GATEWAY_SECRET: ${AI_GATEWAY_SECRET}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      AI_NUM_CTX: ${AI_NUM_CTX:-16384}
      # Cloud BYOK: key stays server-side; never sent to the browser.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Admin-allowlisted compatible endpoint; the browser cannot choose a URL.
      COMPAT_BASE_URL: ${COMPAT_BASE_URL:-}
      COMPAT_API_KEY: ${COMPAT_API_KEY:-}
      COMPAT_ALLOW_LOOPBACK: ${COMPAT_ALLOW_LOOPBACK:-false}
      # Request bodies are capped in code (MAX_BODY_BYTES, 8 MiB default); this
      # ceiling is the second line, so a bug in that reader cannot take the host.
      MAX_BODY_BYTES: ${SIDECAR_MAX_BODY_BYTES:-8388608}
      PORT: "8090"
    # Measured: the sidecar idles around 24 MiB and streams no history, so 512 MiB
    # is generous. Pinned to 2 cpus because it only relays one request at a time.
    cpus: ${SIDECAR_CPUS:-2}
    mem_limit: ${SIDECAR_MEM_LIMIT:-512m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # sidecar listens only on the compose network; no host port mapping

  # Optional bridge for hosts where host.docker.internal does NOT reach the host
  # Ollama (native Linux / WSL Docker Engine). On Docker Desktop this is not
  # needed. Enable with: docker compose --profile native-bridge up -d
  # It listens only on the docker bridge gateway (never 0.0.0.0) and forwards to
  # the host loopback, so Ollama stays unexposed. See docs/THREAT-MODEL.md.
  ollama-bridge:
    profiles: ["native-bridge"]
    restart: always
    image: node:24-alpine
    container_name: ${AILS_PREFIX:-ails}-ollama-bridge
    network_mode: host
    environment:
      BRIDGE_BIND: ${OLLAMA_BRIDGE_BIND:-172.17.0.1}
      BRIDGE_PORT: ${OLLAMA_BRIDGE_PORT:-11435}
      OLLAMA_UPSTREAM: ${OLLAMA_UPSTREAM:-127.0.0.1:11434}
    volumes:
      - ../ollama-bridge:/app:ro
    command: ["node", "/app/bridge.mjs"]

  mongo:
    restart: always
    image: ${MONGO_IMAGE:?set in .env (digest-pinned)}
    container_name: ${AILS_PREFIX:-ails}-mongo
    # CE 6.3.2 requires transaction support -> single-member replica set
    # (same pattern as the official toolkit: --replSet overleaf + rs.initiate)
    command: ["--replSet", "overleaf", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: "echo 'db.stats().ok' | mongosh localhost:27017/test --quiet"
      interval: 10s
      timeout: 10s
      retries: 5

  # One-shot: even a single-member replica set must be initiated. The toolkit does
  # this inside bin/up; running it here means a bare `docker compose up -d` works
  # without scripts/up.sh (measured otherwise: CE boot-loops with "Transaction
  # numbers are only allowed on a replica set member or mongos").
  # Initiation runs INSIDE the mongo container (as the toolkit does) so the
  # replica-set member name "mongo:27017" is what the peer will actually use;
  # a client that reaches mongo over the published mapping resolves differently
  # and would leave the set without a primary. Idempotent, so restarts are safe.
  mongo-init:
    image: ${MONGO_IMAGE:?set in .env (digest-pinned)}
    container_name: ${AILS_PREFIX:-ails}-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    network_mode: service:mongo
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mongosh --quiet --eval
        'try { rs.status().ok } catch (e) { rs.initiate({_id:"overleaf", members:[{_id:0, host:"mongo:27017"}]}).ok }'

  redis:
    restart: always
    image: ${REDIS_IMAGE:?set in .env (digest-pinned)}
    container_name: ${AILS_PREFIX:-ails}-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  ce-data:
  mongo-data:
  redis-data:
